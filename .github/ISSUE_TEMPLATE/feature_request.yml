name: Feature request
description: Propose a new source, rule, exception or another project improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the proposal.

        You can propose here, among other things:
        - new filter sources to aggregate,
        - compatibility exceptions,
        - missing rules that block ads or tracking,
        - improvements to the build scripts or the project website.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I checked that a similar proposal has not been submitted yet.
          required: true
  - type: input
    id: summary
    attributes:
      label: Short summary
      description: A one-sentence description of the proposal.
      placeholder: Add an exception for a login widget that is blocked by mistake
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Proposal category
      options:
        - New rule or exception
        - New filter source
        - Build scripts improvement
        - Project website improvement
        - Documentation / UX
        - Other
      default: 0
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: What do you want to achieve and why?
      description: Describe the problem, the need and the benefit of the proposed change.
      placeholder: Site X has an element that is not blocked / is blocked too aggressively, which causes...
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: Describe how you think it could work.
      placeholder: Add a cosmetic exception / a new rule / a new filter source that covers this case.
  - type: input
    id: related_url
    attributes:
      label: Related page address / source / repository
      description: If relevant, paste the URL of the page, filter list, repo or documentation.
      placeholder: https://example.com/ or https://github.com/owner/repo
  - type: textarea
    id: examples
    attributes:
      label: Examples, mockups or proposed rules
      description: You can paste example rules, screenshots or describe edge cases.
      placeholder: |
        Example rule:
        example.com##.annoying-banner

        Or a link to a source worth considering.
  - type: textarea
    id: additional_notes
    attributes:
      label: Additional notes
      placeholder: Other context, alternatives, related issues/PRs, limitations, side effects, etc.
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Concrete examples and reasons help a lot when we rate the priority of a change.
