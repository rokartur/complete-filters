name: Report a bug
description: Report a broken site, a false positive or wrong filtering
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

        **Precise details about the problem help a lot.**

        If you can, check before you submit:
        - whether the problem goes away after you disable this list,
        - whether a similar report already exists in issues,
        - whether you can give the page address and the steps to reproduce the problem.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I checked that the problem is caused by Complete Filters.
          required: true
        - label: I checked that a similar problem has not been reported yet.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Briefly describe what does not work or what is blocked incorrectly.
      placeholder: After I enable the list, the login button on the page stops working.
    validations:
      required: true
  - type: input
    id: page_url
    attributes:
      label: Page address / URL
      description: If the problem is on a specific page, paste the full address.
      placeholder: https://example.com/
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe exactly how to reproduce the problem.
      placeholder: |
        1. Enable the Complete Filters list
        2. Open https://example.com/
        3. Click the "Log in" button
        4. See the error / no response
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The page should work normally and the login button should open the form.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: The form does not open and the console shows an error / the element disappears.
    validations:
      required: true
  - type: dropdown
    id: issue_type
    attributes:
      label: Issue type
      options:
        - False positive / site stops working
        - Ad or tracker not blocked
        - Cosmetic rule problem
        - Compatibility problem
        - Other problem
      default: 0
    validations:
      required: true
  - type: dropdown
    id: blocker
    attributes:
      label: Adblocker used
      options:
        - uBlock Origin
        - AdGuard
        - AdBlock
        - Adblock Plus
        - Brave Shields
        - Other
      default: 0
    validations:
      required: true
  - type: input
    id: blocker_version
    attributes:
      label: Adblocker version
      placeholder: e.g. 1.61.0
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: Give the browser name and version.
      placeholder: e.g. Firefox 140 / Chrome 146 / Safari 26
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
        - Other
      default: 0
    validations:
      required: true
  - type: textarea
    id: additional_info
    attributes:
      label: Additional information
      description: You can paste screenshots, rule snippets, logs or other important notes.
      placeholder: Extra context, screenshots, exception rules, a link to a similar problem, etc.
  - type: markdown
    attributes:
      value: |
        Thanks! The more precise the report, the faster we can add an exception or fix a rule.
