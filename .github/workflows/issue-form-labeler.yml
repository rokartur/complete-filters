name: Issue form labeler

on:
  issues:
    types:
      - opened
      - edited

permissions:
  contents: read
  issues: write

jobs:
  label-from-form:
    if: ${{ github.event.issue.pull_request == null }}
    runs-on: ubuntu-latest

    steps:
      - name: Add labels from issue form selections
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const body = (issue.body || '').replace(/\r\n/g, '\n');

            const featureCategoryLabels = new Map([
              ['New rule or exception', 'category: new rule / exception'],
              ['New filter source', 'category: new filter source'],
              ['Build scripts improvement', 'category: build scripts'],
              ['Project website improvement', 'category: website'],
              ['Documentation / UX', 'category: documentation / UX'],
              ['Other', 'category: other'],
            ]);

            const bugTypeLabels = new Map([
              ['False positive / site stops working', 'issue type: false positive'],
              ['Ad or tracker not blocked', 'issue type: missed ad / tracker'],
              ['Cosmetic rule problem', 'issue type: cosmetic rule'],
              ['Compatibility problem', 'issue type: compatibility'],
              ['Other problem', 'issue type: other'],
            ]);

            const blockerLabels = new Map([
              ['uBlock Origin', 'adblocker: uBlock Origin'],
              ['AdGuard', 'adblocker: AdGuard'],
              ['AdBlock', 'adblocker: AdBlock'],
              ['Adblock Plus', 'adblocker: Adblock Plus'],
              ['Brave Shields', 'adblocker: Brave Shields'],
              ['Other', 'adblocker: other'],
            ]);

            const labelMetadata = {
              'category: new rule / exception': {
                color: '0E8A16',
                description: 'Proposal for a new rule or exception.',
              },
              'category: new filter source': {
                color: '0E8A16',
                description: 'Proposal to add a new filter source.',
              },
              'category: build scripts': {
                color: '0E8A16',
                description: 'Proposal for the build scripts.',
              },
              'category: website': {
                color: '0E8A16',
                description: 'Proposal for the project website.',
              },
              'category: documentation / UX': {
                color: '0E8A16',
                description: 'Proposal for documentation or UX.',
              },
              'category: other': {
                color: '0E8A16',
                description: 'Other proposal category.',
              },
              'issue type: false positive': {
                color: 'D73A4A',
                description: 'A rule blocks something it should not or breaks a site.',
              },
              'issue type: missed ad / tracker': {
                color: 'D73A4A',
                description: 'An ad or tracker is not blocked.',
              },
              'issue type: cosmetic rule': {
                color: 'D73A4A',
                description: 'Problem with a cosmetic rule.',
              },
              'issue type: compatibility': {
                color: 'D73A4A',
                description: 'Compatibility problem.',
              },
              'issue type: other': {
                color: 'D73A4A',
                description: 'Other problem type.',
              },
              'adblocker: uBlock Origin': {
                color: '1D76DB',
                description: 'Reported with uBlock Origin.',
              },
              'adblocker: AdGuard': {
                color: '1D76DB',
                description: 'Reported with AdGuard.',
              },
              'adblocker: AdBlock': {
                color: '1D76DB',
                description: 'Reported with AdBlock.',
              },
              'adblocker: Adblock Plus': {
                color: '1D76DB',
                description: 'Reported with Adblock Plus.',
              },
              'adblocker: Brave Shields': {
                color: '1D76DB',
                description: 'Reported with Brave Shields.',
              },
              'adblocker: other': {
                color: '1D76DB',
                description: 'Reported with another adblocker.',
              },
            };

            function parseSections(markdown) {
              const sections = {};
              const lines = markdown.split('\n');
              let currentHeading = null;
              let currentContent = [];

              for (const line of lines) {
                if (line.startsWith('### ')) {
                  if (currentHeading) {
                    sections[currentHeading] = currentContent.join('\n').trim();
                  }

                  currentHeading = line.slice(4).trim();
                  currentContent = [];
                  continue;
                }

                if (currentHeading) {
                  currentContent.push(line);
                }
              }

              if (currentHeading) {
                sections[currentHeading] = currentContent.join('\n').trim();
              }

              return sections;
            }

            function extractFieldValue(value) {
              if (!value) {
                return '';
              }

              return value
                .split('\n')
                .map((line) => line.trim())
                .filter((line) => line && !line.startsWith('- ['))
                .join(' ')
                .trim();
            }

            async function ensureRepoLabels(names) {
              const repoLabels = await github.paginate(github.rest.issues.listLabelsForRepo, {
                owner,
                repo,
                per_page: 100,
              });
              const existingNames = new Set(repoLabels.map((label) => label.name));

              for (const name of names) {
                if (existingNames.has(name)) {
                  continue;
                }

                const metadata = labelMetadata[name];
                if (!metadata) {
                  core.warning(`Missing metadata for label: ${name}`);
                  continue;
                }

                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color: metadata.color,
                  description: metadata.description,
                });
              }
            }

            const sections = parseSections(body);
            const desiredLabels = new Set();
            const managedForThisIssue = new Set();

            const featureCategory = extractFieldValue(sections['Proposal category']);
            if (featureCategoryLabels.has(featureCategory)) {
              desiredLabels.add(featureCategoryLabels.get(featureCategory));
            }
            if (sections['Proposal category'] !== undefined) {
              for (const labelName of featureCategoryLabels.values()) {
                managedForThisIssue.add(labelName);
              }
            }

            const issueType = extractFieldValue(sections['Issue type']);
            if (bugTypeLabels.has(issueType)) {
              desiredLabels.add(bugTypeLabels.get(issueType));
            }
            if (sections['Issue type'] !== undefined) {
              for (const labelName of bugTypeLabels.values()) {
                managedForThisIssue.add(labelName);
              }
            }

            const blocker = extractFieldValue(sections['Adblocker used']);
            if (blockerLabels.has(blocker)) {
              desiredLabels.add(blockerLabels.get(blocker));
            }
            if (sections['Adblocker used'] !== undefined) {
              for (const labelName of blockerLabels.values()) {
                managedForThisIssue.add(labelName);
              }
            }

            if (managedForThisIssue.size === 0) {
              core.info('Issue does not match supported issue forms. Skipping.');
              return;
            }

            await ensureRepoLabels(desiredLabels);

            const currentIssueLabels = (issue.labels || [])
              .map((label) => (typeof label === 'string' ? label : label.name))
              .filter(Boolean);

            const labelsToRemove = currentIssueLabels.filter(
              (labelName) => managedForThisIssue.has(labelName) && !desiredLabels.has(labelName),
            );

            for (const labelName of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issue.number,
                  name: labelName,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            const labelsToAdd = [...desiredLabels].filter(
              (labelName) => !currentIssueLabels.includes(labelName),
            );

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: labelsToAdd,
              });
            }

            core.info(`Applied labels: ${[...desiredLabels].join(', ') || 'none'}`);
